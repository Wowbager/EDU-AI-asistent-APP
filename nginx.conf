server {
    listen $PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 256;

    # Flutter web SPA: route all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and service worker must always revalidate
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # main.dart.js changes every build but keeps the same filename — short cache
    location ~ ^/main\.dart\.js$ {
        add_header Cache-Control "public, max-age=300";
    }

    # These are NOT immutable: Flutter web content-hashes none of its asset
    # URLs, so /favicon.ico, /icons/*.png and everything under /assets/ keep
    # the same path while their bytes change with every build. "immutable" is
    # a promise the bytes never change, and browsers honour it by skipping
    # revalidation even on a reload — so the pre-rebrand logo outlived the
    # deploy that replaced it, at the Cloudflare edge and in every visitor's
    # browser, with a year to run and no way for the user to flush it
    # (BR-EK9P6J). Same short cache as main.dart.js, which has the same
    # unhashed-but-changing shape; revalidation after that is a cheap 304.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
}
